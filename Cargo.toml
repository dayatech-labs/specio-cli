[package]
name = "specio"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Specio CLI: sync product specs into implementation repositories"
license = "UNLICENSED"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
