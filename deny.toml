[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
# MPL-2.0 is file-level copyleft; `option-ext` (via `directories`) is used unmodified, so only it is excepted.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]
# The workspace crate itself is UNLICENSED/private.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
