name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo run --locked --target ${{ matrix.target }} -- --version

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked --all-targets

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh -n scripts/install.sh && shellcheck -S warning scripts/install.sh
      - run: python3 -m py_compile scripts/release_manifest.py scripts/render_packaging.py scripts/next_version.py scripts/stamp_version.py
      - run: python3 scripts/test_release_scripts.py
      - name: Release manifest and packaging render from sample binaries
        run: |
          d=$(mktemp -d); v=9.9.9
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl; do echo bin > "$d/speq-$v-$t"; echo a > "$d/speq-$v-$t.tar.gz"; done
          echo bin > "$d/speq-$v-x86_64-pc-windows-msvc.exe"; echo a > "$d/speq-$v-x86_64-pc-windows-msvc.zip"
          python3 scripts/release_manifest.py "$d" $v 0123456789abcdef0123456789abcdef01234567 https://example.test/dl
          python3 scripts/render_packaging.py "$d" $v "$d/out"
          grep -q 'class Speq' "$d/out/speq.rb"
          python3 -c "import json,sys; m=json.load(open('$d/manifest.json')); assert m['version']=='$v' and len(m['artifacts'])==4"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose
